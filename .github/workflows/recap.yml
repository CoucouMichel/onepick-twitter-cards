# Génère chaque nuit le récap de la VEILLE (image + faits) et le dépose dans out/.
#
# Pourquoi : la routine du matin (une action planifiée sans personne devant) se fait refuser l'exécution de scripts
# clonés (« Code from External »). Ici le code tourne dans GitHub ; la routine ne lit plus que des DONNÉES (out/recap.png,
# out/faits.txt) et écrit le texte du post. Lecture seule sur Supabase (clé publiable, déjà publique dans l'appli).
# La date est celle de la VEILLE à Paris : un passage avant minuit Paris récapitulerait l'avant-veille, d'où les passages après 22 h 17 UTC seulement.
name: Récap de la veille

# GitHub retarde souvent les tâches planifiées des petits dépôts (constaté : un cron de 2 h 30 UTC parti à 8 h 08, deux jours de
# suite, et le récap de 3 h 00 jamais parti avant la routine). On déclenche donc PLUSIEURS fois, à des minutes « creuses » (pas
# pile à l'heure, moins chargées) : chaque passage régénère la même image pour la même date, et ne commite que si elle change.
on:
  schedule:
    - cron: '17 22 * * *'
    - cron: '43 0 * * *'
    - cron: '23 2 * * *'
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date AAAA-MM-JJ des matchs à récapituler (défaut : la veille, à Paris)'
        required: false

permissions:
  contents: write

concurrency:
  group: recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Playwright et Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Générer le récap
        run: |
          D="${{ github.event.inputs.date }}"
          if [ -z "$D" ]; then D=$(TZ=Europe/Paris date -d yesterday +%F); fi
          mkdir -p out
          node recap.js --date "$D" --out out/recap.png | tee out/faits.txt
          echo "$D" > out/date.txt
      - name: Commiter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out
          if git diff --cached --quiet; then echo "Rien de changé."; else git commit -m "Récap de la veille (automatique)" && git push; fi
