<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Carte X OnePick</title>
<!--
  Modèle de la carte « tout est dans l'image » postée sur X (voir generate.js pour l'usage et les
  règles). Dérivé de la maquette Gemini du 21 oct. 2026 (« deux stratégies : tu sécurises ou tu
  tentes le braquage »), avec ces changements voulus :
   - format 4:5 (540 x 675, exporté à 1080 x 1350) : X rogne les images plus hautes dans le fil ;
   - plus de pastilles de stats ni de faux calendrier : texte plus gros, lisible dans le fil ;
   - couleurs des deux halos = couleur dominante de chaque maillot (même algorithme que le
     comparatif de l'app, voir mcExtractColor dans src/js/views/matchCompare.js) ;
   - la barre « tendance du jour » (répartition des picks) n'existe QUE dans la variante `reveal`
     (après le coup d'envoi). Avant, seul le NOMBRE de joueurs ayant pické le match est affiché :
     dans le jeu, le camp choisi n'est révélé qu'au coup d'envoi.
  Aucune police ni image distante : tout est local ou en data URI, le rendu est déterministe.
  Les données arrivent par `window.__CARD__` (posé par generate.js avant le chargement).
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #060608; }
  body { display: flex; justify-content: center; padding: 0; font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; color: #fff; }

  #card {
    --hc: #2563eb; --ac: #dc2626;
    width: 540px; height: 675px;
    background:
      radial-gradient(circle at 16% 33%, color-mix(in srgb, var(--hc) 30%, transparent) 0%, transparent 46%),
      radial-gradient(circle at 84% 33%, color-mix(in srgb, var(--ac) 30%, transparent) 0%, transparent 46%),
      radial-gradient(circle at 50% 0%, #1c1f14 0%, #0b0c0e 65%);
    background-color: #0b0c0e;
    padding: 22px 24px 22px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
  }

  .top { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-family: 'Plus Jakarta Sans', 'Inter', sans-serif; font-size: 27px; font-weight: 900; letter-spacing: -1.2px; line-height: 1; }
  .tagline { font-size: 9.5px; font-weight: 800; color: #d6ed52; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 5px; }
  .meta { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  .chip { font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #aeb3bf;
          background: #14161b; border: 1px solid #23262d; border-radius: 99px; padding: 4px 11px; }
  .chip.hi { color: #08090a; background: #d6ed52; border-color: #d6ed52; }

  .banner { margin: 14px -24px 6px; padding: 9px 16px; text-align: center; text-transform: uppercase;
            font-size: 12.5px; font-weight: 800; letter-spacing: 1.4px; color: #e4e7ee;
            background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,.08) 50%, rgba(255,255,255,.03));
            border-top: 1px solid rgba(255,255,255,.08); border-bottom: 1px solid rgba(255,255,255,.08); }
  .banner b { color: #d6ed52; font-weight: 800; }

  .arena { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 2px; }
  .team { display: flex; flex-direction: column; align-items: center; }
  .jersey-wrap { position: relative; width: 120px; height: 120px; display: flex; justify-content: center; align-items: center; }
  .jersey { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 12px 18px rgba(0,0,0,.75)); }
  .jersey-ph { width: 92px; height: 92px; border-radius: 50%; background: #1b1e25; border: 2px solid #2a2e38;
               display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 900; color: #8c909c; }
  .odds { position: absolute; bottom: -6px; background: #d6ed52; color: #090a0c; font-size: 17px; font-weight: 900;
          padding: 3px 13px; border-radius: 99px; border: 2px solid #0b0c0e; box-shadow: 0 4px 10px rgba(0,0,0,.5); }
  .tname { font-size: 24px; font-weight: 900; letter-spacing: -.5px; margin-top: 12px; text-align: center; line-height: 1.05; max-width: 168px; }
  .form { display: flex; gap: 3px; margin-top: 7px; }
  .dot { width: 19px; height: 19px; border-radius: 4px; font-size: 11px; font-weight: 900; color: #08090a; display: flex; align-items: center; justify-content: center; }
  .dot.V { background: #38d47e; } .dot.N { background: #f49342; } .dot.D { background: #f06464; }

  .center { display: flex; flex-direction: column; align-items: center; padding: 0 4px; }
  .badge { font-size: 10px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; color: #d6ed52;
           background: rgba(214,237,82,.14); border: 1px solid rgba(214,237,82,.4); border-radius: 99px; padding: 4px 10px; margin-bottom: 6px; white-space: nowrap; }
  .score { font-size: 78px; font-weight: 900; line-height: .95; letter-spacing: -3px; text-shadow: 0 8px 24px rgba(0,0,0,.6); white-space: nowrap; }

  .hype { margin-top: 12px; background: #13151a; border: 1px solid #22252e; border-radius: 14px; padding: 12px 16px; }
  .hype-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; margin-bottom: 8px; }
  .hype-row .l { color: #38d47e; } .hype-row .r { color: #f49342; } .hype-row .c { color: #9ba0ab; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; }
  .bar { height: 8px; background: #252830; border-radius: 99px; display: flex; gap: 3px; overflow: hidden; }
  .bar .a { background: linear-gradient(90deg, #38d47e, #d6ed52); border-radius: 99px; }
  .bar .b { background: #f49342; border-radius: 99px; }
  .count { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 30px; font-size: 15px; font-weight: 800; }
  .count b { font-size: 26px; font-weight: 900; color: #d6ed52; letter-spacing: -1px; }
  .count small { font-size: 11px; font-weight: 600; color: #8c909c; display: block; text-align: left; line-height: 1.25; }

  .picks { display: flex; gap: 12px; margin-top: 12px; }
  .pick { flex: 1; border-radius: 18px; padding: 14px 15px; text-align: left; }
  .pick.safe { background: linear-gradient(145deg, rgba(56,212,126,.16), rgba(19,21,26,.95)); border: 1.5px solid #38d47e; }
  .pick.risk { background: linear-gradient(145deg, rgba(244,147,66,.14), rgba(19,21,26,.95)); border: 1.5px solid rgba(244,147,66,.6); }
  .tag { display: inline-block; font-size: 9.5px; font-weight: 900; letter-spacing: .9px; text-transform: uppercase; color: #08090a; border-radius: 6px; padding: 3px 8px; margin-bottom: 8px; }
  .safe .tag { background: #38d47e; } .risk .tag { background: #f49342; }
  .pname { font-size: 14.5px; font-weight: 800; color: #e4e7ee; line-height: 1.15; min-height: 2.3em; display: flex; align-items: center; }
  .pts { font-size: 40px; font-weight: 900; line-height: 1.05; margin: 3px 0 5px; letter-spacing: -1px; }
  .safe .pts { color: #38d47e; } .risk .pts { color: #f49342; }
  .math { font-size: 11.5px; font-weight: 600; color: #8c909c; line-height: 1.3; }

  .cta { margin-top: auto; background: #d6ed52; color: #08090a; border-radius: 16px; padding: 13px 18px;
         display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 8px 25px rgba(214,237,82,.25); }
  .cta-main { font-size: 16px; font-weight: 900; letter-spacing: -.3px; line-height: 1.15; }
  .cta-sub { font-size: 11px; font-weight: 700; opacity: .8; margin-top: 3px; }
  .cta-pill { background: #08090a; color: #d6ed52; font-size: 12.5px; font-weight: 900; padding: 9px 13px; border-radius: 10px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body>
<div id="card"></div>
<script src="color.js"></script>
<script>
(function () {
    const D = window.__CARD__;
    if (!D) return;
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    const NEUTRAL = OPColor.NEUTRAL, extractColor = OPColor.extractColor; // color.js

    // --- Rendu ----------------------------------------------------------------------------------
    const initials = (n) => String(n).replace(/[^A-Za-zÀ-ÿ0-9 ]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const teamHtml = (t) => `
        <div class="team">
          <div class="jersey-wrap">
            ${t.jersey ? `<img class="jersey" src="${t.jersey}" alt="">` : `<div class="jersey-ph">${esc(initials(t.name))}</div>`}
            <div class="odds">${esc(t.oddLabel)}</div>
          </div>
          <div class="tname">${esc(t.name)}</div>
          ${t.form && t.form.length ? `<div class="form">${t.form.map((f) => `<div class="dot ${esc(f)}">${esc(f)}</div>`).join('')}</div>` : ''}
        </div>`;

    function hypeHtml() {
        if (D.variant === 'reveal') {
            return `<div class="hype">
              <div class="hype-row"><span class="l">${esc(D.reveal.leftLabel)}</span><span class="c">Tendance du jour</span><span class="r">${esc(D.reveal.rightLabel)}</span></div>
              <div class="bar"><div class="a" style="width:${D.reveal.leftPct}%"></div><div class="b" style="width:${D.reveal.rightPct}%"></div></div>
            </div>`;
        }
        // Avant le coup d'envoi : jamais la répartition, seulement le nombre de joueurs (si connu).
        return `<div class="hype"><div class="count">${D.picksCount != null
            ? `<b>${esc(D.picksCount)}</b><small>${D.picksCount > 1 ? 'joueurs ont' : 'joueur a'} déjà pické<br>ce match</small>`
            : `<small style="text-align:center">Les picks de nos joueurs<br>sont révélés au coup d'envoi</small>`}</div></div>`;
    }

    const pickHtml = (p, cls) => `
        <div class="pick ${cls}">
          <div class="tag">${esc(p.tag)}</div>
          <div class="pname">${esc(p.title)}</div>
          <div class="pts">+${esc(p.points)} pts</div>
          <div class="math">${esc(p.math)}</div>
        </div>`;

    async function main() {
        const [hc, ac] = await Promise.all([extractColor(D.home.jersey), extractColor(D.away.jersey)]);
        // Deux teintes voisines (deux maillots rouges) se confondraient : l'extérieur passe en gris ardoise,
        // comme dans le comparatif de l'app.
        let homeCol = hc.hex, awayCol = ac.hex;
        if (hc.hue != null && ac.hue != null) {
            const d = Math.abs(hc.hue - ac.hue); if (Math.min(d, 360 - d) < 25) awayCol = NEUTRAL;
        }
        const card = document.getElementById('card');
        card.style.setProperty('--hc', homeCol);
        card.style.setProperty('--ac', awayCol);
        card.innerHTML = `
          <div class="top">
            <div><div class="logo">ONEPICK</div><div class="tagline">1 jour · 1 pick · 100% gratuit</div></div>
            <div class="meta"><div class="chip">${esc(D.league)}</div><div class="chip hi">${esc(D.whenLabel)}</div></div>
          </div>
          <div class="banner">${D.headline}</div>
          <div class="arena">
            ${teamHtml(D.home)}
            <div class="center">
              <div class="badge">${esc(D.scenarioBadge)}</div>
              <div class="score">${esc(D.scenarioLabel)}</div>
            </div>
            ${teamHtml(D.away)}
          </div>
          ${hypeHtml()}
          <div class="picks">${pickHtml(D.safe, 'safe')}${pickHtml(D.risk, 'risk')}</div>
          <div class="cta">
            <div><div class="cta-main">${esc(D.cta.main)}</div><div class="cta-sub">${esc(D.cta.sub)}</div></div>
            <div class="cta-pill">onepick.football <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#d6ed52" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
          </div>`;
        // Les images sont des data URI : décodées avant la capture pour ne pas photographier du vide.
        await Promise.all([...card.querySelectorAll('img')].map((i) => i.decode ? i.decode().catch(() => {}) : null));
        document.body.dataset.ready = '1';
    }
    main();
})();
</script>
</body>
</html>
